# GitHub Pages site settings for the CNC laser programmer portfolio.
# The README and other content files are left unchanged.
title: "Jason Vines | CNC Laser Programmer & Operator"
description: "CNC Laser Programmer & Operator at Metalworking Solutions in Fairview, Georgia. Programming and running Amada lasers."
theme: jekyll-theme-primer

# Keep relative Markdown links resolving on Pages (tips/, projects/,
# resources/HELPFUL_LINKS.md, and the resume PDF). GitHub Pages also
# merges in its default plugins, including this one.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false


# Use the custom default layout (theme toggle, GLightbox, site.js)
# on every page, including Markdown files with no front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
