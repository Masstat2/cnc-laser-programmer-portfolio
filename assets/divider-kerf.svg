<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 28" width="1280" height="28" role="img" aria-label="Decorative laser-cut divider">
  <defs>
    <linearGradient id="divGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffb000"/>
      <stop offset="78%" stop-color="#fff3c0"/>
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="divBlur" x="-5%" y="-250%" width="110%" height="600%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M 40 14 C 200 8, 360 20, 520 12 S 840 22, 1000 12 S 1160 20, 1240 14" fill="none" stroke="#1a1d21" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 40 14 C 200 8, 360 20, 520 12 S 840 22, 1000 12 S 1160 20, 1240 14" fill="none" stroke="url(#divGlow)" stroke-width="2" stroke-linecap="round" filter="url(#divBlur)"/>
  <g transform="translate(1000,12)">
    <circle r="3.2" fill="#fff6d0"/>
    <line x1="4" y1="-1" x2="14" y2="-6" stroke="#ffd36a" stroke-width="0.8"/>
    <line x1="4" y1="1" x2="13" y2="5" stroke="#ffd36a" stroke-width="0.8"/>
    <circle cx="12" cy="-5" r="0.8" fill="#ffd36a"/>
  </g>
</svg>